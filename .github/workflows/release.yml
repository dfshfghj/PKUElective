name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.2.0)"
        required: true
        default: "0.1.0"
      hide_automation:
        description: "Hide the automation UI"
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles msi
            rust_targets: ""
            cache_key: windows-x64
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles appimage,deb
            rust_targets: ""
            cache_key: linux-x64
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust_targets: x86_64-apple-darwin
            cache_key: macos-x86_64
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin
            cache_key: macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Resolve npm cache directory
        id: npm-cache
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore npm cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ matrix.cache_key }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.cache_key }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build and upload release assets
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEED_BUILD_CHANNEL: Release
          VITE_HIDE_AUTOMATION: ${{ github.event_name != 'workflow_dispatch' || inputs.hide_automation }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: HEED v${{ steps.version.outputs.version }}
          releaseBody: |
            Automated build for HEED.
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }} --config '{"version":"${{ steps.version.outputs.version }}"}'

      - name: Verify packaged application version
        shell: bash
        env:
          ACTUAL_VERSION: ${{ steps.tauri_build.outputs.appVersion }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Packaged version $ACTUAL_VERSION does not match release version $EXPECTED_VERSION" >&2
            exit 1
          fi

  android:
    name: Build Android release
    needs: build
    runs-on: ubuntu-latest
    environment: android-signing
    env:
      NDK_VERSION: 29.0.14206865
      BUILD_TOOLS_VERSION: 36.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;${BUILD_TOOLS_VERSION}" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: android-release

      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_BASE64"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/android-upload-keystore.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/android-upload-keystore.jks"
          } > src-tauri/gen/android/keystore.properties

      - name: Build signed Android packages
        env:
          HEED_BUILD_CHANNEL: Release
          VITE_HIDE_AUTOMATION: ${{ github.event_name != 'workflow_dispatch' || inputs.hide_automation }}
        run: >-
          npm --prefix web exec -- tauri android build --
          --ci --apk --aab --split-per-abi
          --config '{"version":"${{ steps.version.outputs.version }}"}'

      - name: Verify split APK signatures
        shell: bash
        run: |
          APKS=(
            src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk
            src-tauri/gen/android/app/build/outputs/apk/arm/release/app-arm-release.apk
            src-tauri/gen/android/app/build/outputs/apk/x86/release/app-x86-release.apk
            src-tauri/gen/android/app/build/outputs/apk/x86_64/release/app-x86_64-release.apk
          )
          for APK in "${APKS[@]}"; do
            test -f "$APK"
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose --print-certs "$APK"
          done

      - name: Upload Android workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HEED-Android-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk
            src-tauri/gen/android/app/build/outputs/apk/arm/release/app-arm-release.apk
            src-tauri/gen/android/app/build/outputs/apk/x86/release/app-x86-release.apk
            src-tauri/gen/android/app/build/outputs/apk/x86_64/release/app-x86_64-release.apk
            src-tauri/gen/android/app/build/outputs/bundle/arm64Release/*.aab
            src-tauri/gen/android/app/build/outputs/bundle/armRelease/*.aab
            src-tauri/gen/android/app/build/outputs/bundle/x86Release/*.aab
            src-tauri/gen/android/app/build/outputs/bundle/x86_64Release/*.aab

      - name: Upload Android release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          draft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          fail_on_unmatched_files: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk
            src-tauri/gen/android/app/build/outputs/apk/arm/release/app-arm-release.apk
            src-tauri/gen/android/app/build/outputs/apk/x86/release/app-x86-release.apk
            src-tauri/gen/android/app/build/outputs/apk/x86_64/release/app-x86_64-release.apk
            src-tauri/gen/android/app/build/outputs/bundle/arm64Release/*.aab
            src-tauri/gen/android/app/build/outputs/bundle/armRelease/*.aab
            src-tauri/gen/android/app/build/outputs/bundle/x86Release/*.aab
            src-tauri/gen/android/app/build/outputs/bundle/x86_64Release/*.aab
