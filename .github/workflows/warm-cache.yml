name: Warm build caches

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/warm-cache.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/gen/android/**"
      - "web/package-lock.json"

permissions:
  contents: read

jobs:
  build:
    name: Warm ${{ matrix.name }} cache
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            rust_targets: ""
            cargo_args: ""
            cache_key: windows-x64
          - name: Linux x64
            platform: ubuntu-22.04
            rust_targets: ""
            cargo_args: ""
            cache_key: linux-x64
          - name: macOS Intel
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            cargo_args: --target x86_64-apple-darwin
            cache_key: macos-x86_64
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            cargo_args: --target aarch64-apple-darwin
            cache_key: macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Resolve npm cache directory
        id: npm-cache
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ matrix.cache_key }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Build frontend assets
        run: npm run build
        working-directory: web

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.cache_key }}

      - name: Compile release dependencies
        run: cargo build --release --workspace ${{ matrix.cargo_args }}

  android:
    name: Warm Android release cache
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
      BUILD_TOOLS_VERSION: 36.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;${BUILD_TOOLS_VERSION}" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo-tauri CLI
        id: cargo-tauri-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-${{ runner.os }}-2.11.0

      - name: Install cargo-tauri CLI
        if: steps.cargo-tauri-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.11.0 --locked

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: android-release

      - name: Warm Android release build
        env:
          HEED_BUILD_CHANNEL: Release
          VITE_HIDE_AUTOMATION: true
        run: >-
          ./web/node_modules/.bin/tauri android build
          --ci --apk --split-per-abi
