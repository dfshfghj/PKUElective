[package]
name = "elective-tauri"
version = "0.1.0"
edition = "2024"

[lib]
name = "elective_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
elective-captcha-rten = { path = "../crates/elective-captcha-rten" }
elective-core = { path = "../crates/elective-core" }
keyring = "4.1.5"
keyring-core = "1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-process = "2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = ["keychain"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
