[package]
name = "elective-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
cookie_store = "0.21.1"
reqwest = { version = "0.12", default-features = false, features = ["charset", "cookies", "json", "rustls-tls"] }
reqwest_cookie_store = "0.8.2"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
